<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutritional Insights</title>

    <link
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 p-4 text-white">
        <h1 class="text-3xl font-semibold">Nutritional Insights</h1>
    </header>

    <main class="flex items-center justify-center px-4 py-16">

        <div class="w-full max-w-md bg-white p-6 shadow-lg rounded-lg">

            <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                class="p-2 border rounded w-full mb-3"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                class="p-2 border rounded w-full mb-3"
            >

            <!-- 2FA code field: revealed after password if the account has 2FA enabled -->
            <div id="twofaSection" class="mb-3" hidden>
                <label for="twofaCode" class="block text-sm text-gray-700 mb-1">
                    Enter the 6-digit code from your authenticator app
                </label>
                <input
                    id="twofaCode"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="6-digit code"
                    class="p-2 border rounded w-full mb-2"
                >
                <button
                    id="verify2faButton"
                    class="bg-blue-600 text-white py-2 px-4 rounded w-full"
                >
                    Verify code
                </button>
            </div>

            <button
                id="loginButton"
                class="bg-blue-600 text-white py-2 px-4 rounded w-full mb-3"
            >
                Login
            </button>

            <button
                id="googleLoginButton"
                class="bg-gray-800 text-white py-2 px-4 rounded w-full mb-4"
            >
                Continue with Google
            </button>

            <p
                id="authMessage"
                class="text-center text-sm mb-4"
            ></p>

            <p class="text-center text-sm">
                Don't have an account?
                <a href="register.html" class="text-blue-600 font-semibold">
                    Register
                </a>
            </p>

        </div>

    </main>

    <script src="supabase.js"></script>

    <script>

        const authMessage = document.getElementById("authMessage");
        const client = supabaseClient;

        function setMsg(text, isError) {
            authMessage.textContent = text || "";
            authMessage.className =
                "text-center text-sm mb-4 " + (isError ? "text-red-600" : "text-gray-700");
        }

        // Reveal the 2FA code field on this page (after password) and hide the sign-in buttons.
        function show2FA() {
            document.getElementById("twofaSection").hidden = false;
            document.getElementById("loginButton").hidden = true;
            document.getElementById("googleLoginButton").hidden = true;
            setMsg("Enter the 6-digit code from your authenticator app.", false);
            document.getElementById("twofaCode").focus();
        }

        // After a session exists: require 2FA (show the field) or continue to the dashboard.
        async function proceedAfterAuth() {
            try {
                const { data, error } =
                    await client.auth.mfa.getAuthenticatorAssuranceLevel();
                if (!error && data &&
                    data.nextLevel === "aal2" && data.currentLevel === "aal1") {
                    show2FA();
                    return;
                }
            } catch (e) { /* if the MFA check fails, fall through to the dashboard */ }
            window.location.href = "dashboard.html";
        }

        // Already logged in? (may still need to complete 2FA)
        async function checkExistingSession() {
            const { data } = await client.auth.getSession();
            if (data.session) proceedAfterAuth();
        }

        // Email/password login
        document
            .getElementById("loginButton")
            .addEventListener("click", async () => {

                const email = document.getElementById("loginEmail").value.trim();
                const password = document.getElementById("loginPassword").value;

                if (!email || !password) {
                    setMsg("Please enter your email and password.", true);
                    return;
                }

                const { error } =
                    await client.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) { setMsg(error.message, true); return; }

                // Signed in with the password — now enforce 2FA if this account has it.
                proceedAfterAuth();
            });

        // Verify the 2FA code entered on this page
        document
            .getElementById("verify2faButton")
            .addEventListener("click", async () => {
                const code = document.getElementById("twofaCode").value.trim();
                if (!/^\d{6}$/.test(code)) {
                    setMsg("Enter the 6-digit code.", true);
                    return;
                }
                setMsg("Verifying…", false);
                try {
                    const factors = await client.auth.mfa.listFactors();
                    const totp = (((factors.data && factors.data.totp) || [])
                        .find(function (f) { return f.status === "verified"; }));
                    if (!totp) throw new Error("No verified authenticator found.");

                    const ch = await client.auth.mfa.challenge({ factorId: totp.id });
                    if (ch.error) throw ch.error;

                    const v = await client.auth.mfa.verify({
                        factorId: totp.id,
                        challengeId: ch.data.id,
                        code: code
                    });
                    if (v.error) throw v.error;

                    window.location.href = "dashboard.html";
                } catch (err) {
                    setMsg("Verification failed: " + err.message, true);
                }
            });

        // Enter key submits the code
        document
            .getElementById("twofaCode")
            .addEventListener("keydown", function (e) {
                if (e.key === "Enter") document.getElementById("verify2faButton").click();
            });

        // Google OAuth login
        document
            .getElementById("googleLoginButton")
            .addEventListener("click", async () => {

                const { error } =
                    await supabaseClient.auth.signInWithOAuth({
                        provider: "google",
                        options: {
                            redirectTo: window.location.origin + "/dashboard.html"
                        }
                    });

                if (error) {
                    authMessage.textContent =
                        "Google login failed: " + error.message;

                    authMessage.className =
                        "text-center text-sm mb-4 text-red-600";
                }
            });

        checkExistingSession();

    </script>

</body>
</html>
